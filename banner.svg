<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#38bdf8" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- background layers -->
  <rect width="880" height="240" rx="18" fill="url(#card)"/>
  <rect width="880" height="240" rx="18" fill="url(#dots)"/>
  <rect width="880" height="240" rx="18" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="44" y="74" width="6" height="92" rx="3" fill="url(#bar)"/>

  <!-- name -->
  <text x="70" y="122" font-size="50" font-weight="800" letter-spacing="0.5" fill="#ffffff">Tanvir Hasan</text>

  <!-- subtitle -->
  <text x="71" y="156" font-size="19" font-weight="600" fill="#38bdf8">Founder &amp; CEO @ Zephlo Tech  •  Full-Stack Engineer</text>

  <!-- status -->
  <circle cx="77" cy="186" r="5" fill="#22c55e"/>
  <text x="91" y="191" font-size="15" font-weight="500" fill="#94a3b8">Available for freelance &amp; collaborations</text>
</svg>
